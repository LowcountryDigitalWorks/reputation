name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # Draft PR content updates intentionally skip runner allocation. Marking the PR
    # ready triggers the full existing validation suite; converted_to_draft is not subscribed.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repository hygiene
        shell: bash
        run: |
          git diff --check
          test -f README.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f LICENSE
          test -f docs/PRODUCT.md
          test -f docs/security/THREAT_MODEL.md

      - name: Validate internal Markdown links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          failures = []
          pattern = re.compile(r'(?<!!)\[[^\]]+\]\(([^)]+)\)')
          for md in root.rglob('*.md'):
              text = md.read_text(encoding='utf-8')
              for target in pattern.findall(text):
                  target = target.strip()
                  if not target or target.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  path_part = target.split('#', 1)[0]
                  if not path_part:
                      continue
                  candidate = (md.parent / path_part).resolve()
                  try:
                      candidate.relative_to(root.resolve())
                  except ValueError:
                      failures.append(f'{md}: link escapes repository: {target}')
                      continue
                  if not candidate.exists():
                      failures.append(f'{md}: missing internal link target: {target}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Secret pattern check
        shell: bash
        run: |
          if git grep -nEI '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk-[A-Za-z0-9_-]{20,}|gh[pour]_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9._-]{36,}|github_pat_[A-Za-z0-9_]{20,})' -- . \
              ':(exclude)*.lock' ':(exclude)*.svg'; then
            echo "Potential secret pattern found."
            exit 1
          fi

      - name: Aggregate reputation monitoring fixtures (source-only)
        shell: bash
        run: |
          node --version
          node --check proofs/aggregate-monitor/src/aggregate-monitor.mjs
          node --check proofs/aggregate-monitor/tools/compare-manual.mjs
          node --test proofs/aggregate-monitor/test/*.test.mjs

      - name: Unified workbench proof contracts (fictional / source-only)
        shell: bash
        run: |
          node --check proofs/ops-workbench/src/fixtures.mjs
          node --check proofs/ops-workbench/src/workbench.mjs
          node --check proofs/ops-workbench/src/app.mjs
          node --test proofs/ops-workbench/test/*.test.mjs
          python - <<'PY'
          from pathlib import Path
          html = Path('proofs/ops-workbench/index.html').read_text(encoding='utf-8')
          js = Path('proofs/ops-workbench/src/app.mjs').read_text(encoding='utf-8')
          css = Path('proofs/ops-workbench/styles.css').read_text(encoding='utf-8')
          assert "connect-src 'none'" in html and "form-action 'none'" in html
          assert 'theme-toggle' in html and 'Skip to workbench' in html
          assert 'noindex,nofollow,noarchive' in html
          assert 'https://' not in html and 'http://' not in html
          assert 'fetch(' not in js and 'localStorage' not in js and 'sessionStorage' not in js
          assert '@media(max-width:730px)' in css and 'prefers-reduced-motion' in css
          # Validate the documented local HTTP root and the cross-proof ES module:
          # the workbench imports a sibling under proofs/aggregate-monitor.
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from functools import partial
          from threading import Thread
          from urllib.request import urlopen
          workbench_doc = Path('proofs/ops-workbench/README.md').read_text(encoding='utf-8')
          assert 'http.server 8765 --bind 127.0.0.1 --directory .' in workbench_doc
          assert '../../aggregate-monitor/src/aggregate-monitor.mjs' in Path(
              'proofs/ops-workbench/src/workbench.mjs'
          ).read_text(encoding='utf-8')
          class QuietHandler(SimpleHTTPRequestHandler):
              def log_message(self, *args): pass
          server = ThreadingHTTPServer(('127.0.0.1', 0), partial(QuietHandler, directory='.'))
          runner = Thread(target=server.serve_forever, daemon=True)
          runner.start()
          try:
              base = f'http://127.0.0.1:{server.server_port}'
              for route in (
                  '/proofs/ops-workbench/',
                  '/proofs/ops-workbench/styles.css',
                  '/proofs/ops-workbench/src/app.mjs',
                  '/proofs/ops-workbench/src/workbench.mjs',
                  '/proofs/aggregate-monitor/src/aggregate-monitor.mjs',
              ):
                  with urlopen(base + route, timeout=5) as response:
                      assert response.status == 200, route
                      assert response.read(1), route
          finally:
              server.shutdown()
              runner.join(timeout=5)
              server.server_close()
          PY
